name: Build USDA catalog
on:
  workflow_dispatch:
  push:
    branches: [etap-7-household-portions]
    paths: [scripts/build-generic-food-catalog.mjs, scripts/read-usda-csv.py, .github/workflows/usda-refresh.yml]
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: etap-7-household-portions
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/build-generic-food-catalog.mjs --refresh
      - name: Save official normalized catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/usda
          git diff --cached --quiet || git commit -m 'Refresh official USDA generic catalog'
          git push origin HEAD:etap-7-household-portions
