name: Android APK
on:
  push:
    branches: [feature/local-sync-export, feature/android-apk, main, recovery/benger-1.0.6, feature/contextual-barcode, feature/daily-reminders, feature/today-widget, feature/basketball-widget, feature/basketball-visual-polish, feature/arena-motion, feature/recipe-screenshot-import, feature/interactive-charts, fix/recipe-screenshot-regions, fix/ocr-ingredient-punctuation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    if: github.ref != 'refs/heads/feature/local-sync-export'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Testy Node
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/benger-android-node-tests.log"
      - name: Testy Chromium
        shell: bash
        run: npm run test:browser 2>&1 | tee "$RUNNER_TEMP/benger-android-browser-tests.log"
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Raport testów Androida
        if: always()
        run: node scripts/ci-test-report.mjs "$RUNNER_TEMP/benger-android-node-tests.log" "$RUNNER_TEMP/benger-android-browser-tests.log"
      - run: npm run android:prepare
      - name: Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'"
      - name: Compile Android and run lint (no private key needed)
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:testDebugUnitTest
      - name: Restore private signing identity for trusted builds only
        id: signing
        if: github.repository == 'kubanik21-crypto/Benger' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/android-apk')
        env:
          SIGNING_BUNDLE: ${{ secrets.BENGER_ANDROID_SIGNING_BUNDLE }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib
          raw=os.environ.get('SIGNING_BUNDLE','')
          if not raw:
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('ready=false\n')
              print('Signing is not configured; Android compilation passed, no installable APK is published.')
          else:
              data=json.loads(base64.b64decode(raw,validate=True))
              expected=pathlib.Path('android/signing-certificate.sha256').read_text().strip()
              if data['certificateSha256']!=expected:raise SystemExit('Wrong signing identity')
              target=pathlib.Path(os.environ['RUNNER_TEMP'])/'benger-signing';target.mkdir(mode=0o700)
              (target/'benger.p12').write_bytes(base64.b64decode(data['keystore'],validate=True))
              (target/'password.txt').write_text(data['password']+'\n')
              (target/'signing.json').write_text(json.dumps({'applicationId':'io.github.kubanik21crypto.benger','alias':'benger','certificateSha256':expected}))
              for p in target.iterdir():p.chmod(0o600)
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('ready=true\n')
          PY
      - name: Build signed installable APK
        if: steps.signing.outputs.ready == 'true'
        run: node scripts/android/build-apk.mjs "$RUNNER_TEMP/benger-signing" "$RUNNER_TEMP/benger-apk"
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: Benger-Android-APK-${{ github.sha }}
          path: ${{ runner.temp }}/benger-apk/
          retention-days: 30
      - name: Remove private signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/benger-signing"

  recipe-picker-test:
    if: github.repository == 'kubanik21-crypto/Benger' && github.ref == 'refs/heads/feature/local-sync-export' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[picker-test-apk]')))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    concurrency:
      group: benger-recipe-picker-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check requested source and private build inputs
        env:
          PICKER_KEY_PRESENT: ${{ secrets.BENGER_PICKER_API_KEY != '' }}
        run: |
          node -e 'if(require("./package.json").version!=="1.0.18")process.exit(1);if(process.env.PICKER_KEY_PRESENT!=="true")throw Error("Required Picker secret is missing.")'
          git merge-base --is-ancestor 759df23 HEAD
      - run: npm ci
      - name: Node regression tests
        run: npm test
      - name: Chromium regression tests
        run: npm run test:browser
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - name: Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0'"
      - name: Build unsigned APK for local signing
        env:
          BENGER_GOOGLE_AUTH_ENABLED: 'true'
          BENGER_RECIPE_PICKER_ENABLED: 'true'
          BENGER_PICKER_APP_ID: '481332161595'
          BENGER_GOOGLE_OAUTH_PROJECT_NUMBER: '481332161595'
          BENGER_PREVIOUS_VERSION_CODE: '28496407'
          BENGER_PICKER_API_KEY: ${{ secrets.BENGER_PICKER_API_KEY }}
        run: |
          node scripts/android/build-unsigned-picker-apk.mjs "$RUNNER_TEMP/benger-picker-apk"
          cd android
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest
      - name: UNSIGNED artifact for local signing — DO NOT INSTALL
        uses: actions/upload-artifact@v4
        with:
          name: Benger-UNSIGNED-1.0.18-${{ github.sha }}
          path: |
            ${{ runner.temp }}/benger-picker-apk/*.apk
            ${{ runner.temp }}/benger-picker-apk/metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove private build material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/benger-picker-apk"
          rm -rf android/app/build
