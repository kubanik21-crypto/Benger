name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Testy obliczeń
        run: npm test
      - name: Testy w Chrome
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          "$CHROMIUM_PATH" --version
          npm run test:browser
