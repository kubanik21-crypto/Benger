name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, etap-3-katalog-produktow, etap-4-voice-first, etap-5-smart-voice, etap-6-pwa-catalog-scanner, etap-7-household-portions, etap-8-recipes-navigation]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Testy obliczeń
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/benger-node-tests.log"
      - name: Testy w Chrome
        shell: bash
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          "$CHROMIUM_PATH" --version
          npm run test:browser 2>&1 | tee "$RUNNER_TEMP/benger-browser-tests.log"
      - name: Raport testów
        if: always()
        run: node scripts/ci-test-report.mjs "$RUNNER_TEMP/benger-node-tests.log" "$RUNNER_TEMP/benger-browser-tests.log"
