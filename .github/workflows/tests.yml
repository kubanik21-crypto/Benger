name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, recovery/benger-1.0.6, feature/contextual-barcode, feature/daily-reminders, feature/today-widget, feature/basketball-widget, feature/basketball-visual-polish, feature/arena-motion, release-v1.0.0-exercise-guide, feature/conversational-recipes, feature/diary-quantity-edit]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Testy obliczeń
        shell: bash
        run: npm test 2>&1 | tee "$RUNNER_TEMP/benger-node-tests.log"
      - name: Testy w Chrome
        shell: bash
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          "$CHROMIUM_PATH" --version
          npm run test:browser 2>&1 | tee "$RUNNER_TEMP/benger-browser-tests.log"
      - name: Build production release candidate
        env:
          BENGER_OFF_SEARCH_URL: https://benger-off-search-preview.kubanik-21.workers.dev/search
        run: npm run build:web -- "$RUNNER_TEMP/benger-production"
      - uses: actions/upload-artifact@v4
        with:
          name: benger-production
          path: ${{ runner.temp }}/benger-production/
          include-hidden-files: true
          retention-days: 7
      - name: Raport testów
        if: always()
        run: node scripts/ci-test-report.mjs "$RUNNER_TEMP/benger-node-tests.log" "$RUNNER_TEMP/benger-browser-tests.log"
