name: Deploy production

on:
  workflow_run:
    workflows: [Tests]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: benger-production-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'kubanik21-crypto/Benger' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check exact tested main
        id: current
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          CURRENT_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$CURRENT_SHA" = "$TESTED_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit is already on main; skip this deployment.'
          fi
      - name: Verify Pages source
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq 'select(.build_type == "legacy" and .source.branch == "gh-pages" and .source.path == "/") | .html_url' > "$RUNNER_TEMP/benger-pages-url"
          test -s "$RUNNER_TEMP/benger-pages-url"
      - name: Build clean production artifact
        if: steps.current.outputs.deploy == 'true'
        run: npm run build:web -- "$RUNNER_TEMP/benger-production"
      - name: Publish tested root and retire old previews
        if: steps.current.outputs.deploy == 'true'
        id: publish
        run: node scripts/publish-production.mjs --push "$RUNNER_TEMP/benger-production"
      - name: Request Pages build
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
