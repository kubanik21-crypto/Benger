name: Stage 12 preview

on:
  push:
    branches: [etap-12-training]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: benger-stage-12-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.repository == 'kubanik21-crypto/Benger' && github.ref == 'refs/heads/etap-12-training'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Tests
        shell: bash
        run: |
          npm test 2>&1 | tee "$RUNNER_TEMP/benger-node-tests.log"
          CHROMIUM_PATH=/usr/bin/google-chrome npm run test:browser 2>&1 | tee "$RUNNER_TEMP/benger-browser-tests.log"
          git diff --check
      - name: Raport testów
        if: always()
        run: node scripts/ci-test-report.mjs "$RUNNER_TEMP/benger-node-tests.log" "$RUNNER_TEMP/benger-browser-tests.log"
      - name: Prepare public artifact
        run: node scripts/prepare-preview.mjs /tmp/benger-preview "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: benger-stage-12-preview
          path: /tmp/benger-preview/
          include-hidden-files: true
          retention-days: 7
      - name: Verify existing Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq 'select(.build_type == "legacy" and .source.branch == "gh-pages" and .source.path == "/") | .html_url' > /tmp/benger-pages-url
          test -s /tmp/benger-pages-url
      - name: Publish only preview directory
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish-preview.mjs --push
      - name: Request Pages build
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Preview link
        run: |
          printf '%s\n' 'Preview: https://kubanik21-crypto.github.io/Benger/previews/etap-12/' >> "$GITHUB_STEP_SUMMARY"
          printf 'Source commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
