<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Speech diagnostics</title><link rel="stylesheet" href="./style.css"></head><body><main><h1>Speech diagnostics</h1><p>Audio może trafić do dostawcy przeglądarki. Nie nagrywamy audio. Raport z tekstem pozostaje w tej karcie; pobierasz go samodzielnie.</p><label for="mode">Tryb</label><select id="mode"><option value="A">A: continuous=true, interim=true</option><option value="B">B: continuous=false, interim=true</option><option value="C">C: continuous=false, interim=false</option></select><p>Powiedz: „250 ml mleka”.</p><button id="start" class="button-primary">Uruchom mikrofon</button><button id="stop" class="button-secondary" disabled>Zakończ</button><button id="download" class="button-secondary" disabled>Pobierz raport diagnostyczny</button><p id="status" role="status"></p><p id="transcript"></p><pre id="report" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><a href="./">Powrót do preview</a></main><script type="module" src="./speech-diagnostics.js"></script></body></html>
