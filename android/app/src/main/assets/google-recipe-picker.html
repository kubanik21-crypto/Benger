<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://apis.google.com; style-src 'unsafe-inline'; frame-src https://docs.google.com https://drive.google.com; connect-src https://*.googleapis.com https://apis.google.com https://docs.google.com https://drive.google.com; img-src data: https://*.googleusercontent.com https://*.gstatic.com https://*.google.com"><title>Wybór źródła przepisów</title><style>body{font:18px system-ui;background:#102019;color:#e7f1e9;padding:1rem}</style><p id="status">Wybierz istniejący arkusz żywieniowy. Ten panel nie zapisuje przepisów ani nie zmienia arkusza.</p><script>
// Isolated native-owned WebView, no Capacitor bridge/storage. Only the official Picker gets the short-lived token.
let started=false;
window.startBengerPicker=function(config){if(started)return;started=true;let finished=false;const send=(type,doc={})=>{if(finished)return;finished=true;window.bengerPickerResult.postMessage(JSON.stringify({type,nonce:config.nonce,...doc}));config.token='';config.apiKey='';};
const script=document.createElement('script');script.src='https://apis.google.com/js/api.js';script.onerror=()=>send('error');script.onload=()=>gapi.load('picker',{callback:()=>{try{const view=new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS).setIncludeFolders(false);const picker=new google.picker.PickerBuilder().setAppId(config.appId).setDeveloperKey(config.apiKey).setOAuthToken(config.token).setOrigin(location.origin).addView(view).setCallback(data=>{if(data.action===google.picker.Action.CANCEL)send('cancelled');if(data.action===google.picker.Action.PICKED){const doc=data.docs?.[0];if(doc)send('picked',{id:doc.id,mimeType:doc.mimeType});else send('error');}}).build();config.token='';config.apiKey='';picker.setVisible(true);}catch{send('error');}},onerror:()=>send('error'),timeout:20000,ontimeout:()=>send('error')});document.head.append(script);};
</script></html>
